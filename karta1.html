        const setIndex = async () => {
            const indDiv = document.querySelector('#inddiv');
            const data = await getIndexData(`${indexURL}json`);
            indDiv.innerHTML = `<pre>${data}</pre>`;
        };

        const getIndexData = async (url) => {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const jarr = await response.json();
                //return jarr.map(item => `<a href="${item.name}">${item.name}</a><br>`).join('');
                return jarr.map(item => `<button type=button onclick="setView('${indexURL}data/${item.name}')">${item.name}</button>`).join('<br>');
            } catch (error) {
                console.error('Error fetching data:', error);
                return '';
            }
        }
